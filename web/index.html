<!DOCTYPE html>
<html lang="ms">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="application-name" content="e-Hadis40">
  <meta name="description" content="e-Hadis40 - Platform Pengajaran dan Pembelajaran Interaktif berasaskan Modul Penghayatan Hadis 40 Imam Nawawi Edisi Kedua. Rujukan modul: Kementerian Pendidikan Malaysia (KPM).">
  <meta name="theme-color" content="#081B17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="e-Hadis40">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #081B17;
      height: 100%;
      overflow: hidden;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 30% 20%, rgba(15, 157, 122, 0.16) 0%, transparent 55%),
                  radial-gradient(circle at 75% 80%, rgba(126, 219, 208, 0.10) 0%, transparent 50%),
                  #081B17;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }
    .splash-loader {
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(15, 157, 122, 0.18);
      border-top-color: rgba(96, 199, 169, 0.85);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.25s ease-out';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 280);
      }
    });
  </script>
  <title>e-Hadis40</title>
</head>
<body>
  <div id="loading">
    <div class="splash-loader"></div>
  </div>
  <noscript>Aplikasi ini memerlukan JavaScript untuk berfungsi.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
